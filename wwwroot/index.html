<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Book Manager</title>
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #f5f7fb;
      color: #222;
    }
    .container {
      max-width: 1100px;
      margin: 40px auto;
      padding: 20px;
    }
    .card {
      background: white;
      border-radius: 12px;
      box-shadow: 0 6px 18px rgba(0,0,0,0.08);
      padding: 20px;
      margin-bottom: 20px;
    }
    h2 {
      margin-top: 0;
    }
    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
    }
    form {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    input, button {
      padding: 10px 12px;
      font-size: 14px;
      border-radius: 8px;
      border: 1px solid #ccc;
    }
    button {
      background: #2563eb;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: 600;
    }
    button.secondary {
      background: #16a34a;
    }
    button.danger {
      background: #dc2626;
    }
    .row {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }
    .status {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #eef2ff;
      color: #1e3a8a;
      white-space: pre-wrap;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 10px;
    }
    th, td {
      border: 1px solid #ddd;
      padding: 10px;
      text-align: left;
    }
    th {
      background: #f3f4f6;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="card">
      <h2>Authentication</h2>
      <div class="grid">
        <form id="registerForm">
          <h3>Register</h3>
          <input id="regUser" placeholder="Username" required />
          <input id="regPass" type="password" placeholder="Password" required />
          <button type="submit">Register</button>
        </form>

        <form id="loginForm">
          <h3>Login</h3>
          <input id="loginUser" placeholder="Username" required />
          <input id="loginPass" type="password" placeholder="Password" required />
          <button type="submit" class="secondary">Login</button>
        </form>
      </div>
      <div id="authStatus" class="status">Chưa đăng nhập</div>
    </div>

    <div class="card">
      <h2>Books</h2>
      <div class="row">
        <button id="loadBooksBtn">Load books</button>
        <button id="logoutBtn" class="danger">Logout</button>
      </div>

      <form id="bookForm">
        <input id="bookId" type="hidden" />
        <input id="bookTitle" placeholder="Title" required />
        <input id="bookAuthor" placeholder="Author" required />
        <input id="bookPrice" type="number" step="0.01" placeholder="Price" required />
        <input id="bookCategory" placeholder="Category" required />
        <input id="bookStock" type="number" placeholder="Stock" required />
        <div class="row">
          <button type="submit">Save Book</button>
          <button type="button" id="resetBookBtn" class="secondary">Reset</button>
        </div>
      </form>

      <table>
        <thead>
          <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Author</th>
            <th>Price</th>
            <th>Category</th>
            <th>Stock</th>
            <th>Action</th>
          </tr>
        </thead>
        <tbody id="bookTableBody"></tbody>
      </table>
    </div>
  </div>

  <script>
    const apiBase = 'http://localhost:8080';
    const authStatus = document.getElementById('authStatus');
    const bookTableBody = document.getElementById('bookTableBody');

    function getToken() {
      return localStorage.getItem('token');
    }

    function setStatus(message) {
      authStatus.textContent = message;
    }

    function authHeaders() {
      return {
        'Content-Type': 'application/json'
      };
    }

    async function apiRequest(url, options = {}) {
      const response = await fetch(url, {
        ...options,
        headers: {
          ...authHeaders(),
          ...(options.headers || {})
        }
      });

      const data = await response.json().catch(() => null);

      if (!response.ok) {
        throw new Error(data?.message || data?.title || 'Request failed');
      }

      return data;
    }

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('regUser').value;
      const password = document.getElementById('regPass').value;

      try {
        const result = await apiRequest(`${apiBase}/api/auth/register`, {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        setStatus(`Register success: ${JSON.stringify(result, null, 2)}`);
      } catch (err) {
        setStatus(`Register failed: ${err.message}`);
      }
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const username = document.getElementById('loginUser').value;
      const password = document.getElementById('loginPass').value;

      try {
        const result = await apiRequest(`${apiBase}/api/auth/login`, {
          method: 'POST',
          body: JSON.stringify({ username, password })
        });
        setStatus(`Login success. User: ${result.user.username}`);
        loadBooks();
      } catch (err) {
        setStatus(`Login failed: ${err.message}`);
      }
    });

    document.getElementById('logoutBtn').addEventListener('click', () => {
      localStorage.removeItem('token');
      setStatus('Logged out');
      bookTableBody.innerHTML = '';
    });

    document.getElementById('bookForm').addEventListener('submit', async (e) => {
      e.preventDefault();

      const id = document.getElementById('bookId').value;
      const payload = {
        title: document.getElementById('bookTitle').value,
        author: document.getElementById('bookAuthor').value,
        price: Number(document.getElementById('bookPrice').value),
        category: document.getElementById('bookCategory').value,
        stock: Number(document.getElementById('bookStock').value)
      };

      try {
        if (id) {
          await apiRequest(`${apiBase}/api/books/${id}`, {
            method: 'PUT',
            body: JSON.stringify(payload)
          });
          setStatus('Book updated successfully');
        } else {
          await apiRequest(`${apiBase}/api/books`, {
            method: 'POST',
            body: JSON.stringify(payload)
          });
          setStatus('Book created successfully');
        }

        resetBookForm();
        await loadBooks();
      } catch (err) {
        setStatus(`Book save failed: ${err.message}`);
      }
    });

    document.getElementById('resetBookBtn').addEventListener('click', resetBookForm);

    document.getElementById('loadBooksBtn').addEventListener('click', loadBooks);

    async function loadBooks() {
      try {
        const books = await apiRequest(`${apiBase}/api/books`);
        renderBooks(books);
      } catch (err) {
        setStatus(`Load books failed: ${err.message}`);
      }
    }

    function renderBooks(books) {
      bookTableBody.innerHTML = '';

      books.forEach((book) => {
        const row = document.createElement('tr');
        row.innerHTML = `
          <td>${book.id}</td>
          <td>${book.title}</td>
          <td>${book.author}</td>
          <td>${book.price}</td>
          <td>${book.category}</td>
          <td>${book.stock}</td>
          <td>
            <button type="button" data-edit="${book.id}" class="secondary">Edit</button>
            <button type="button" data-delete="${book.id}" class="danger">Delete</button>
          </td>
        `;
        bookTableBody.appendChild(row);
      });

      document.querySelectorAll('[data-edit]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-edit');
          const book = (await apiRequest(`${apiBase}/api/books/${id}`));
          document.getElementById('bookId').value = book.id;
          document.getElementById('bookTitle').value = book.title;
          document.getElementById('bookAuthor').value = book.author;
          document.getElementById('bookPrice').value = book.price;
          document.getElementById('bookCategory').value = book.category;
          document.getElementById('bookStock').value = book.stock;
        });
      });

      document.querySelectorAll('[data-delete]').forEach((btn) => {
        btn.addEventListener('click', async () => {
          const id = btn.getAttribute('data-delete');
          try {
            await apiRequest(`${apiBase}/api/books/${id}`, { method: 'DELETE' });
            setStatus('Book deleted');
            await loadBooks();
          } catch (err) {
            setStatus(`Delete failed: ${err.message}`);
          }
        });
      });
    }

    function resetBookForm() {
      document.getElementById('bookForm').reset();
      document.getElementById('bookId').value = '';
    }
  </script>
</body>
</html>
