$kind: http-request
url: "{{baseUrl}}/api/books?search=&sort=price_asc&minPrice=0&maxPrice=1000000"
method: GET
headers:
  Accept: application/json
queryParams:
  - key: search
    value: ""
    description: Keyword matching Title, Author, or Category
  - key: sort
    value: price_asc
    description: "Sort order: price_asc or price_desc"
  - key: minPrice
    value: "0"
    description: Minimum price
  - key: maxPrice
    value: "1000000"
    description: Maximum price
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response is an array", function () {
          var data = pm.response.json();
          pm.expect(Array.isArray(data)).to.be.true;
      });

      pm.test("Each book has required fields", function () {
          var data = pm.response.json();
          if (data.length > 0) {
              data.forEach(function(book) {
                  pm.expect(book).to.have.property('id');
                  pm.expect(book).to.have.property('title');
                  pm.expect(book).to.have.property('author');
                  pm.expect(book).to.have.property('price');
              });
          }
      });

      pm.test("Books are sorted by price ascending", function () {
          var data = pm.response.json();
          if (data.length > 1) {
              for (var i = 0; i < data.length - 1; i++) {
                  pm.expect(data[i].price).to.be.at.most(data[i + 1].price);
              }
          }
      });

      pm.test("All books are within price range (0 - 1000000)", function () {
          var data = pm.response.json();
          data.forEach(function(book) {
              pm.expect(book.price).to.be.at.least(0);
              pm.expect(book.price).to.be.at.most(1000000);
          });
      });
    language: text/javascript
order: 3000
