$kind: http-request
url: "{{baseUrl}}/api/auth/refresh"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refreshToken": "{{refreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Returns new token pair", function () {
          var data = pm.response.json();
          pm.expect(data).to.have.property('accessToken');
          pm.expect(data).to.have.property('refreshToken');
          pm.expect(data.accessToken).to.be.a('string').and.not.empty;
          pm.expect(data.refreshToken).to.be.a('string').and.not.empty;

          pm.environment.set("accessToken", data.accessToken);
          pm.environment.set("refreshToken", data.refreshToken);
          pm.collectionVariables.set("accessToken", data.accessToken);
          pm.collectionVariables.set("refreshToken", data.refreshToken);
          console.log("✅ Tokens refreshed and updated!");
      });
    language: text/javascript
order: 3000
