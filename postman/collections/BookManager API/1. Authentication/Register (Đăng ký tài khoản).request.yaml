$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "username": "{{username}}",
      "password": "{{password}}"
    }
scripts:
  - type: beforeRequest
    code: |-
      // Generate a dynamic unique username for each test run to avoid "already exists" error
      var randomSuffix = Math.floor(Math.random() * 100000);
      var dynamicUsername = "user_" + randomSuffix;
      pm.variables.set("username", dynamicUsername);
      pm.environment.set("username", dynamicUsername);
      pm.collectionVariables.set("username", dynamicUsername);
      console.log("📝 Registering with username:", dynamicUsername);
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });

      pm.test("Response time is under 2000ms", function () {
          pm.expect(pm.response.responseTime).to.be.below(2000);
      });

      pm.test("Content-Type is application/json", function () {
          pm.response.to.have.header("Content-Type");
          pm.expect(pm.response.headers.get("Content-Type")).to.include("application/json");
      });

      pm.test("Response contains user details", function () {
          var json = pm.response.json();
          pm.expect(json).to.have.property('id');
          pm.expect(json).to.have.property('username');
          pm.expect(json).to.have.property('role');
      });

      pm.test("Username matches the registered username", function () {
          var json = pm.response.json();
          pm.expect(json.username).to.equal(pm.variables.get("username"));
      });

      pm.test("Password is not exposed in response", function () {
          var json = pm.response.json();
          pm.expect(json).to.not.have.property('password');
          pm.expect(json).to.not.have.property('passwordHash');
      });

      pm.test("ID is a valid non-empty value", function () {
          var json = pm.response.json();
          pm.expect(json.id).to.exist;
          pm.expect(json.id).to.be.a('number');
          pm.expect(json.id).to.be.above(0);
      });
    language: text/javascript
order: 1000
